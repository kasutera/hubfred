<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src https://github.com https://*.githubusercontent.com; base-uri https://github.com; form-action 'none'">
<meta name="referrer" content="no-referrer">
<style>
:root { color-scheme: light dark; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0; --subtle:#f6f8fa; --link:#0969da; --note:#0969da; --tip:#1a7f37; --warning:#9a6700; --important:#8250df; --caution:#cf222e; }
@media (prefers-color-scheme:dark) { :root { --fg:#f0f6fc; --muted:#9198a1; --border:#3d444d; --subtle:#151b23; --link:#4493f8; --note:#4493f8; --tip:#3fb950; --warning:#d29922; --important:#ab7df8; --caution:#f85149; } }
body { margin:0; padding:8px 12px 20px; color:var(--fg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow-wrap:anywhere; }
a { color:var(--link); }
img { max-width:100%; height:auto; }
h1,h2,h3,h4 { margin:20px 0 12px; line-height:1.25; font-weight:600; }
h1,h2 { padding-bottom:.3em; border-bottom:1px solid var(--border); }
h1 { font-size:2em; } h2 { font-size:1.5em; } h3 { font-size:1.25em; }
body > :first-child { margin-top:0; }
p,ul,ol,pre,blockquote,table { margin:0 0 16px; }
ul,ol { padding-left:2em; } li + li { margin-top:.25em; } li > ul, li > ol { margin-bottom:0; }
hr { border:0; border-top:1px solid var(--border); margin:24px 0; }
blockquote { border-left:4px solid var(--border); padding:0 1em; color:var(--muted); }
code { font: .875em ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--subtle); border-radius:6px; padding:.2em .4em; }
pre { overflow:auto; background:var(--subtle); border-radius:6px; padding:14px; }
pre code { padding:0; background:none; }
code .kw { color:var(--caution); } code .st,code .dv { color:var(--link); } code .co { color:var(--muted); }
table { display:block; width:max-content; max-width:100%; overflow:auto; border-collapse:collapse; }
th,td { border:1px solid var(--border); padding:6px 12px; }
tr:nth-child(even) { background:var(--subtle); }
.task-list, li:has(> label > input[type=checkbox]) { list-style:none; }
.task-list input { margin:0 .45em 0 -1.4em; pointer-events:none; }
.note,.tip,.important,.warning,.caution { border-left:4px solid var(--note); padding:.2em 1em; margin-bottom:16px; }
.tip { border-color:var(--tip); } .important { border-color:var(--important); } .warning { border-color:var(--warning); } .caution { border-color:var(--caution); }
</style>
